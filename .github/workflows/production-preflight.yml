name: OpenMontage Production Preflight

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/production-preflight.yml"
  workflow_dispatch:
    inputs:
      demo:
        description: Zero-key Remotion demo to render
        required: true
        default: code-to-screen
        type: choice
        options:
          - code-to-screen
          - world-in-numbers
          - focusflow-pitch

permissions:
  contents: read

concurrency:
  group: production-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Production Engine Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEMO: ${{ inputs.demo || 'code-to-screen' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: remotion-composer/package-lock.json

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install Python development dependencies
        run: make install-dev

      - name: Install Remotion dependencies
        working-directory: remotion-composer
        run: npm ci

      - name: Lint smoke checks
        run: make lint

      - name: Contract tests
        run: make test-contracts

      - name: Discover OpenMontage providers and capabilities
        run: make preflight

      - name: Probe HyperFrames runtime
        continue-on-error: true
        run: make hyperframes-doctor

      - name: List zero-key demos
        run: make demo-list

      - name: Render zero-key production demo
        run: .venv/bin/python render_demo.py "$DEMO"

      - name: Validate rendered master with ffprobe
        shell: bash
        run: |
          FILE="projects/demos/renders/$DEMO.mp4"
          test -s "$FILE"
          ffprobe -v error \
            -show_entries format=duration,size,bit_rate \
            -show_entries stream=index,codec_name,codec_type,width,height,r_frame_rate,pix_fmt \
            -of json "$FILE" | tee production-preflight-report.json

          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          
          report = json.loads(Path("production-preflight-report.json").read_text())
          streams = report.get("streams", [])
          video = next((s for s in streams if s.get("codec_type") == "video"), None)
          audio = next((s for s in streams if s.get("codec_type") == "audio"), None)
          duration = float(report.get("format", {}).get("duration", 0))
          
          assert video is not None, "No video stream found"
          assert video.get("codec_name") == "h264", f"Expected h264, got {video.get('codec_name')}"
          assert int(video.get("width", 0)) > 0, "Invalid video width"
          assert int(video.get("height", 0)) > 0, "Invalid video height"
          assert duration > 0, "Invalid duration"
          
          summary = Path(__import__("os").environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as fh:
              fh.write(f"video_codec={video.get('codec_name')}\n")
              fh.write(f"resolution={video.get('width')}x{video.get('height')}\n")
              fh.write(f"frame_rate={video.get('r_frame_rate')}\n")
              fh.write(f"duration_seconds={duration:.3f}\n")
              fh.write(f"audio_codec={audio.get('codec_name') if audio else 'none'}\n")
          PY

      - name: Upload rendered MP4 and QA report
        uses: actions/upload-artifact@v4
        with:
          name: openmontage-preflight-${{ env.DEMO }}
          path: |
            projects/demos/renders/${{ env.DEMO }}.mp4
            production-preflight-report.json
          if-no-files-found: error
          retention-days: 7

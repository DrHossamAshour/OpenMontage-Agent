name: OpenMontage Production Preflight

on:
  workflow_dispatch:
    inputs:
      demo:
        description: Zero-key Remotion demo to render
        required: true
        default: code-to-screen
        type: choice
        options:
          - code-to-screen
          - world-in-numbers
          - focusflow-pitch

permissions:
  contents: read

concurrency:
  group: production-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Production Engine Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: remotion-composer/package-lock.json

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install Python development dependencies
        run: make install-dev

      - name: Install Remotion dependencies
        working-directory: remotion-composer
        run: npm ci

      - name: Lint smoke checks
        run: make lint

      - name: Contract tests
        run: make test-contracts

      - name: Discover OpenMontage providers and capabilities
        run: make preflight

      - name: Probe HyperFrames runtime
        continue-on-error: true
        run: make hyperframes-doctor

      - name: List zero-key demos
        run: make demo-list

      - name: Render zero-key production demo
        run: .venv/bin/python render_demo.py "${{ inputs.demo }}"

      - name: Validate rendered master with ffprobe
        shell: bash
        run: |
          FILE="projects/demos/renders/${{ inputs.demo }}.mp4"
          test -s "$FILE"
          ffprobe -v error \
            -show_entries format=duration,size,bit_rate \
            -show_entries stream=index,codec_name,codec_type,width,height,r_frame_rate,pix_fmt \
            -of json "$FILE" | tee production-preflight-report.json

          VIDEO_CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$FILE")"
          WIDTH="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$FILE")"
          HEIGHT="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$FILE")"
          DURATION="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$FILE")"

          echo "video_codec=$VIDEO_CODEC" >> "$GITHUB_STEP_SUMMARY"
          echo "resolution=${WIDTH}x${HEIGHT}" >> "$GITHUB_STEP_SUMMARY"
          echo "duration_seconds=$DURATION" >> "$GITHUB_STEP_SUMMARY"

          test "$VIDEO_CODEC" = "h264"
          test "$WIDTH" -gt 0
          test "$HEIGHT" -gt 0

      - name: Upload rendered MP4 and QA report
        uses: actions/upload-artifact@v4
        with:
          name: openmontage-preflight-${{ inputs.demo }}
          path: |
            projects/demos/renders/${{ inputs.demo }}.mp4
            production-preflight-report.json
          if-no-files-found: error
          retention-days: 7

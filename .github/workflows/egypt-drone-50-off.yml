name: Egypt Drone 50 Off POC

on:
  push:
    branches:
      - production/egypt-drone-50-off
    paths:
      - ".github/workflows/egypt-drone-50-off.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg and Arabic font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig fonts-noto-core
          ffmpeg -version | head -n 1
          fc-match "Noto Sans Arabic" | head -n 1

      - name: Download temporary licensed/free stock clips
        run: |
          mkdir -p work/assets work/out
          curl -L --fail --retry 3 -o work/assets/cairo.mp4 "https://www.pexels.com/download/video/10717893/"
          curl -L --fail --retry 3 -o work/assets/aswan.mp4 "https://www.pexels.com/download/video/29233321/"
          curl -L --fail --retry 3 -o work/assets/alexandria.mp4 "https://www.pexels.com/download/video/7579789/"
          curl -L --fail --retry 3 -o work/assets/countryside.mp4 "https://www.pexels.com/download/video/29138103/"
          curl -L --fail --retry 3 -o work/assets/storefront.mp4 "https://www.pexels.com/download/video/4606781/"
          curl -L --fail --retry 3 -o work/assets/fashion.mp4 "https://www.pexels.com/download/video/6335703/"
          ls -lh work/assets

      - name: Prepare Arabic overlays
        run: |
          printf '%s' 'خصم 50%%' > work/sale.txt
          printf '%s' 'زوروا أي فرع من فروعنا الآن' > work/cta.txt
          FONT="$(fc-match -f '%{file}\n' 'Noto Sans Arabic' | head -n 1)"
          echo "FONT=$FONT" >> "$GITHUB_ENV"

      - name: Render cinematic vertical POC
        shell: bash
        run: |
          ffmpeg -y             -ss 6  -t 3.6 -i work/assets/cairo.mp4             -ss 2  -t 3.6 -i work/assets/aswan.mp4             -ss 1  -t 3.2 -i work/assets/alexandria.mp4             -ss 3  -t 3.2 -i work/assets/countryside.mp4             -ss 0  -t 3.0 -i work/assets/storefront.mp4             -ss 0  -t 4.0 -i work/assets/fashion.mp4             -filter_complex "
            [0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,fps=30,setpts=PTS-STARTPTS,eq=contrast=1.06:saturation=1.08[v0];
            [1:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,fps=30,setpts=PTS-STARTPTS,eq=contrast=1.06:saturation=1.08[v1];
            [2:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,fps=30,setpts=PTS-STARTPTS,eq=contrast=1.06:saturation=1.08[v2];
            [3:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,fps=30,setpts=PTS-STARTPTS,eq=contrast=1.06:saturation=1.08[v3];
            [4:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,fps=30,setpts=PTS-STARTPTS,eq=contrast=1.08:saturation=1.10[v4];
            [5:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,fps=30,setpts=PTS-STARTPTS,eq=contrast=1.08:saturation=1.10[v5];
            [v0][v1]xfade=transition=fade:duration=0.35:offset=3.25[x1];
            [x1][v2]xfade=transition=wipeleft:duration=0.35:offset=6.50[x2];
            [x2][v3]xfade=transition=fadefast:duration=0.35:offset=9.35[x3];
            [x3][v4]xfade=transition=slideleft:duration=0.35:offset=12.20[x4];
            [x4][v5]xfade=transition=fade:duration=0.35:offset=14.85[x5];
            [x5]drawtext=fontfile='$FONT':textfile=work/sale.txt:fontsize=150:fontcolor=white:borderw=8:bordercolor=black@0.45:x=(w-text_w)/2:y=h*0.34:enable='between(t,15.0,18.8)',
                drawtext=fontfile='$FONT':textfile=work/cta.txt:fontsize=62:fontcolor=white:borderw=5:bordercolor=black@0.45:x=(w-text_w)/2:y=h*0.70:enable='between(t,16.8,18.8)',
                fade=t=out:st=18.3:d=0.5[vout]
            "             -f lavfi -t 18.8 -i "anoisesrc=color=pink:amplitude=0.02"             -f lavfi -t 18.8 -i "sine=frequency=55:sample_rate=48000"             -f lavfi -t 0.8 -i "sine=frequency=75:sample_rate=48000"             -filter_complex_script /dev/null             -map "[vout]"             -filter_complex "
            [6:a]lowpass=f=1400,volume=0.5[a0];
            [7:a]volume=0.08[a1];
            [8:a]volume=0.35,adelay=15000|15000[a2];
            [a0][a1][a2]amix=inputs=3:duration=longest:normalize=0,afade=t=in:st=0:d=0.8,afade=t=out:st=18.0:d=0.8[aout]
            "             -map "[aout]"             -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p             -c:a aac -b:a 192k -movflags +faststart             -shortest work/out/egypt-drone-50-off-poc.mp4

      - name: QA with ffprobe
        run: |
          ffprobe -v error -show_entries format=duration,size,bit_rate -show_entries stream=codec_name,codec_type,width,height,r_frame_rate -of json work/out/egypt-drone-50-off-poc.mp4 | tee work/out/qa.json
          test -s work/out/egypt-drone-50-off-poc.mp4

      - name: Upload POC
        uses: actions/upload-artifact@v4
        with:
          name: egypt-drone-50-off-poc
          path: |
            work/out/egypt-drone-50-off-poc.mp4
            work/out/qa.json
          if-no-files-found: error
          retention-days: 7
